# docker-compose.integration.yml
#
# System Integration Test stack for CI.
# Starts InfluxDB + huginn with a short-interval test config. The InfluxDB
# token and the metrics API key are mounted as files, exactly as in production —
# the comment here used to claim inline env vars, which would have contradicted
# the secrets-are-files rule this project is built on (ADR-0002). The files are
# throwaway test credentials created by the caller; see Usage below.
#
# Usage (CI creates the secret files first):
#   echo -n "integration-test-token-huginn-ci" > /tmp/influx_token.txt
#   echo -n "integration-test-metrics-key" > /tmp/metrics_api_key.txt
#   docker compose -f docker-compose.integration.yml up -d --build
#   bash scripts/integration-test.sh
#   docker compose -f docker-compose.integration.yml down -v

services:
  huginn:
    build: .
    image: huginn:ci
    environment:
      HUGINN_UI_ENABLED: "true"
    volumes:
      - ./config/config.integration.yaml:/etc/huginn/config.yaml:ro
      - /tmp/influx_token.txt:/run/secrets/influx_token:ro
      - /tmp/metrics_api_key.txt:/run/secrets/metrics_api_key:ro
    # Loopback only, like the shipped docker-compose.yml. These are the
    # unauthenticated debug UI and a metrics endpoint whose key is a known test
    # string, on a machine that may be a shared CI runner or a developer laptop
    # — there is no reason for either to be reachable from the network.
    ports:
      - "127.0.0.1:9116:9116"
      - "127.0.0.1:9464:9464"
    depends_on:
      influxdb:
        condition: service_healthy
      tls-endpoint:
        condition: service_started

  # Self-signed HTTPS endpoint for the TLS certificate-expiry probe — the cert
  # comes from Caddy's internal CA (see config/Caddyfile.integration), so the
  # test never leaves the compose network. Not published to the host; huginn
  # reaches it by service name.
  tls-endpoint:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    volumes:
      - ./config/Caddyfile.integration:/etc/caddy/Caddyfile:ro

  influxdb:
    image: influxdb:2.7-alpine@sha256:991673dc2d237bd79b15d6627410d72de111387e7dac673dbb92cf3333ffcc8c
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_ORG: testorg
      DOCKER_INFLUXDB_INIT_BUCKET: testbucket
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: testpassword123
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: integration-test-token-huginn-ci
    # Same reasoning, and stronger: this InfluxDB is initialised with a known
    # admin token.
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
