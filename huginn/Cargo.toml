[package]
name = "huginn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "huginn"
path = "src/main.rs"

[dependencies]
# Path only, no version requirement. A version here is the crates.io publishing
# pattern, and it is a second copy of the workspace version: a release bump made
# the crates x.y.z while these requirements still read ^0.1.0, and resolution
# failed outright — before a test ran, on the release PR. With `publish = false`
# there is nothing a version requirement could serve.
huginn-core   = { path = "../crates/huginn-core" }
huginn-probes = { path = "../crates/huginn-probes" }
huginn-influx = { path = "../crates/huginn-influx" }
huginn-web    = { path = "../crates/huginn-web" }
tokio              = { workspace = true }
clap               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
serde_json         = { workspace = true }
colored            = { workspace = true }
chrono             = { workspace = true }
reqwest            = { workspace = true }

[dev-dependencies]
tempfile  = { workspace = true }
reqwest   = { workspace = true }
wiremock  = { workspace = true }
# `process` is only needed by binary_lifecycle_test (runs the real binary as a
# subprocess). Keeping it here rather than in the workspace feature set keeps it
# out of the shipped release binary.
tokio     = { workspace = true, features = ["process"] }

