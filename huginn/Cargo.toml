[package]
name = "huginn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "huginn"
path = "src/main.rs"

[dependencies]
huginn-core   = { path = "../crates/huginn-core",   version = "0.1.0" }
huginn-probes = { path = "../crates/huginn-probes", version = "0.1.0" }
huginn-influx = { path = "../crates/huginn-influx", version = "0.1.0" }
huginn-web    = { path = "../crates/huginn-web",    version = "0.1.0" }
tokio              = { workspace = true }
clap               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
serde_json         = { workspace = true }
colored            = { workspace = true }
chrono             = { workspace = true }
reqwest            = { workspace = true }

[dev-dependencies]
tempfile  = { workspace = true }
reqwest   = { workspace = true }
wiremock  = { workspace = true }
# `process` is only needed by binary_lifecycle_test (runs the real binary as a
# subprocess). Keeping it here rather than in the workspace feature set keeps it
# out of the shipped release binary.
tokio     = { workspace = true, features = ["process"] }

