influx:
  url: "http://localhost:8086"
  org: "myorg"
  bucket: "monitoring"
  # Path to a file containing the InfluxDB token.
  # For Docker: mount the token as a secret at this path.
  # Example: docker secret create influx_token ./token.txt
  # NEVER put the token value directly in this file or in an ENV variable.
  token_file: "/run/secrets/influx_token"

  # ── Batching ──────────────────────────────────────────────────────────────
  # Results are grouped into one write instead of one POST per probe.
  batch_size: 10          # write once this many results are buffered
  batch_timeout_ms: 1000  # ...or after this long, whichever comes first

  # ── Resilience ────────────────────────────────────────────────────────────
  # A failed write is retried, not discarded. Retries are unbounded in attempts
  # but bounded in memory: when the queue is full the OLDEST batch is dropped,
  # so the most recent data survives an outage. Batches InfluxDB will never
  # accept (bad token, wrong bucket, malformed data) are discarded immediately
  # rather than blocking everything behind them.
  max_buffered_bytes: 8388608     # 8 MiB ≈ 35k–55k results
  retry_initial_backoff_ms: 500   # doubles per attempt...
  retry_max_backoff_ms: 30000     # ...up to this
  shutdown_drain_timeout_ms: 5000 # give up draining after this on shutdown

# Optional debug web UI (axum, no external JS/CSS)
ui:
  enabled: false
  # The UI has no authentication and publishes every probe target, so it binds
  # loopback only. In a container set 0.0.0.0 (or HUGINN_UI_BIND=0.0.0.0) —
  # published ports reach the container's bridge IP, not its loopback — and put
  # it on a trusted network. See docs/SECURITY.md.
  bind: "127.0.0.1"
  port: 9116  # http://localhost:9116

# Logging
log:
  format: pretty  # "pretty" (coloured) or "json"
  level: info     # trace, debug, info, warn, error  (also via RUST_LOG)

probes:
  # ── HTTP ──────────────────────────────────────────────────────────────────
  - name: "web-homepage"
    type: http
    target: "https://example.com"
    interval_secs: 30
    timeout_secs: 5
    expected_status: 200

  # ── HTTPS (same as http, target uses https://) ───────────────────────────
  - name: "api-health"
    type: https
    target: "https://api.example.com/health"
    interval_secs: 15
    timeout_secs: 5
    expected_status: 200

  # ── TCP ───────────────────────────────────────────────────────────────────
  - name: "postgres"
    type: tcp
    target: "db.example.com:5432"
    interval_secs: 15
    timeout_secs: 3

  # ── SMTP ──────────────────────────────────────────────────────────────────
  - name: "smtp-mail"
    type: smtp
    target: "mail.example.com:25"
    interval_secs: 60
    timeout_secs: 10

  # ── IMAP ──────────────────────────────────────────────────────────────────
  - name: "imap-mail"
    type: imap
    target: "mail.example.com:143"
    interval_secs: 60
    timeout_secs: 10

  # ── UDP (DNS example) ─────────────────────────────────────────────────────
  - name: "dns-google"
    type: udp
    target: "8.8.8.8:53"
    interval_secs: 30
    timeout_secs: 2

  # ── TLS certificate expiry ────────────────────────────────────────────────
  # Handshakes with an HTTPS endpoint and reports days until the certificate
  # expires as the `tls_cert_expiry_days` metric (negative once expired). Target
  # is host:port and must speak HTTPS; verification is skipped, so self-signed
  # and already-expired certificates are still read.
  - name: "cert-example-com"
    type: tls
    target: "example.com:443"
    interval_secs: 3600
    timeout_secs: 5
