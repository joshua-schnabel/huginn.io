influx:
  url: "http://influxdb:8086"
  org: "testorg"
  bucket: "testbucket"
  token_file: "/run/secrets/influx_token"
  # Flush immediately so the test can query InfluxDB right away
  batch_size: 1
  batch_timeout_ms: 200

ui:
  enabled: true
  # 0.0.0.0, not the 127.0.0.1 default: scripts/integration-test.sh drives the UI
  # from outside the container through the published port, which never reaches
  # the container's loopback.
  bind: "0.0.0.0"
  port: 9116

metrics:
  enabled: true
  # Same reasoning as ui.bind: the test scrapes through the published port.
  bind: "0.0.0.0"
  port: 9464
  # Exercises the optional Bearer auth end-to-end (file mounted by compose).
  api_key_file: "/run/secrets/metrics_api_key"

log:
  format: json
  level: info

probes:
  # Probe the InfluxDB TCP port — always reachable in the test stack
  - name: "influxdb-tcp"
    type: tcp
    target: "influxdb:8086"
    interval_secs: 2
    timeout_secs: 2

  # Probe the InfluxDB HTTP health endpoint
  - name: "influxdb-http"
    type: http
    target: "http://influxdb:8086/health"
    interval_secs: 2
    timeout_secs: 2
    expected_status: 200

  # Docker's embedded DNS (127.0.0.11 inside every container) resolves compose
  # service names — no external resolver involved.
  - name: "docker-dns"
    type: dns
    target: "127.0.0.11:53"
    interval_secs: 2
    timeout_secs: 2
    dns_query: "influxdb"

  # The UDP probe's payload is a DNS query, so the embedded DNS answers it too.
  - name: "docker-dns-udp"
    type: udp
    target: "127.0.0.11:53"
    interval_secs: 2
    timeout_secs: 2

  # Caddy sidecar with a fresh 96h self-signed cert (config/Caddyfile.integration);
  # also exercises the tls_expiry_fail_days threshold end-to-end.
  - name: "tls-cert"
    type: tls
    target: "tls-endpoint:443"
    interval_secs: 2
    timeout_secs: 2
    tls_expiry_fail_days: 1

  # `https` as its own configured type. It shares an executor with `http`, but
  # the *type* is part of the config surface and reaches InfluxDB and Prometheus
  # as a tag value — so it is worth proving the whole path, not assuming it from
  # the http probe above. The Caddy sidecar answers "OK" over its self-signed
  # certificate; huginn's HTTPS client verifies normally, so this would fail —
  # which is exactly why the target is the plaintext InfluxDB endpoint instead.
  # Probing the self-signed one over https is a job for the tls probe, and it
  # does it above.
  - name: "influxdb-https-type"
    type: https
    target: "http://influxdb:8086/health"
    interval_secs: 2
    timeout_secs: 2
    expected_status: 200

  # SMTP and IMAP against the mail-endpoint sidecar. These are the only probes
  # that parse a protocol banner, and they had no end-to-end coverage — the
  # split-greeting bug lived in exactly this code and could only be caught by
  # unit tests until now.
  - name: "smtp-banner"
    type: smtp
    target: "mail-endpoint:25"
    interval_secs: 2
    timeout_secs: 2

  - name: "imap-greeting"
    type: imap
    target: "mail-endpoint:143"
    interval_secs: 2
    timeout_secs: 2
