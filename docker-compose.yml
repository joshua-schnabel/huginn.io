services:
  huginn:
    build: .
    restart: unless-stopped
    environment:
      HUGINN_CONFIG: /etc/huginn/config.yaml
      HUGINN_UI_ENABLED: "true"
      # Required in a container: the default is 127.0.0.1, which the published
      # port below cannot reach. Set here rather than in config.yaml because that
      # file is your own copy of config.example.yaml and won't be updated for you.
      # This binds inside the container only — the `ports` entry below decides
      # who can actually reach it.
      HUGINN_UI_BIND: "0.0.0.0"
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: myorg
      INFLUX_BUCKET: monitoring
      INFLUX_TOKEN_FILE: /run/secrets/influx_token
    volumes:
      - ./config/config.yaml:/etc/huginn/config.yaml:ro
    ports:
      # Host loopback, not 0.0.0.0: the debug UI has no authentication and lists
      # every probe target, so publishing it to the whole network has to be a
      # deliberate edit — drop the "127.0.0.1:" prefix only if that is what you
      # mean. Same reasoning as the `ui.bind` default.
      - "127.0.0.1:9116:9116"
    secrets:
      - influx_token
    # Container hardening. huginn writes nothing to its filesystem (config is
    # mounted read-only, the token is a tmpfs secret, results go to InfluxDB
    # over HTTP), so a read-only rootfs costs nothing and removes a whole class
    # of post-exploitation footholds. It needs no capabilities at all: it binds
    # ports above 1024 and never changes uid.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Bounds, not tuning: each idle HTTP connection costs a task plus buffers and
    # nothing caps how many a client may open, so without a limit a connection
    # flood against a published UI port grows the process until the host OOMs.
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      influxdb:
        condition: service_healthy

  influxdb:
    # Digest-pinned like the Dockerfile's bases: the tag is movable, and this
    # container is initialised with an admin token. Dependabot updates the
    # tag and digest together.
    image: influxdb:2.7-alpine@sha256:991673dc2d237bd79b15d6627410d72de111387e7dac673dbb92cf3333ffcc8c
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: monitoring
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influx_admin_password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influx_token
    ports:
      # Loopback for the same reason as huginn's UI: the database holds every
      # measurement and its admin token was just initialised. Reach it from
      # elsewhere via a reverse proxy you control, not by widening this.
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    secrets:
      - influx_token
      - influx_admin_password
    # No read-only rootfs here — InfluxDB writes its data and WAL. Dropping
    # privilege escalation still applies.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  influxdb-data:

secrets:
  influx_token:
    file: ./secrets/influx_token.txt
  influx_admin_password:
    file: ./secrets/influx_admin_password.txt
