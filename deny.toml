# deny.toml
#
# Configuration for cargo-deny (https://embarkstudios.github.io/cargo-deny/)
# Run: cargo deny check
#
# cargo-deny is a superset of cargo-audit:
#   - advisories: known vulnerabilities (RustSec database)
#   - licenses:   only approved FOSS licenses
#   - bans:       duplicate crates, forbidden crates
#   - sources:    only crates.io as registry (no unknown mirrors)

# ── Advisories (RustSec vulnerability database) ──────────────────────────────
[advisories]
# Suppressions for the blocking `cargo deny check` in
# .github/workflows/ci.yml. Same rules as .trivyignore.yaml, for the same
# reason — a suppression argued for after the fact tends to be argued for
# loosely:
#
#   1. Every entry says why the vulnerable code cannot be reached in huginn's
#      deployment, not merely that no fix exists. "Upstream has not fixed it"
#      alone is not a reason to ship it silently.
#   2. Every entry carries `expires <YYYY-MM-DD>` in its reason. The
#      "Check suppression expiries" step in ci.yml fails the job once the date
#      has passed, so the finding blocks again. cargo-deny accepts only `id`
#      and `reason` on an ignore entry (checked 2026-10-29), which is why the
#      date lives in the reason and is enforced next to it rather than by
#      cargo-deny itself. If a later release grows a native expiry, move to it.
#   3. Delete the entry the moment it is no longer needed.
#
# cargo-deny prints the reason on every run, so the argument and the date are in
# front of whoever reads a green gate, not only in this file.
ignore = [
    # `unsafe-libyaml` is C transpiled to Rust, pulled in by `serde_yaml_ng`,
    # and the advisory is `unmaintained` — no vulnerability is known, and
    # `serde_yaml_ng` 0.10 is its own latest release, so there is nothing to
    # upgrade to. Reachability: huginn parses exactly one YAML document, at
    # `crates/huginn-core/src/config.rs:548`, from the `--config` path, during
    # startup and before any listener binds or any probe runs. That is the only
    # non-test call. No probe result, no SMTP/IMAP banner, no HTTP body and no
    # InfluxDB response ever reaches a YAML parser, so the input is the
    # operator's own file — the same trust level as the binary itself. Moving
    # off the crate means replacing the config parser, which is a dependency
    # change and a behaviour risk (the control-character handling the F-07 tests
    # rely on is this parser's), so it is a decision of its own rather than part
    # of a lockfile bump.
    { id = "RUSTSEC-2024-0449", reason = "expires 2027-01-31 — unmaintained, not vulnerable; reached only by the operator's own config file at startup (see deny.toml for the full argument)" },
]

# ── Licenses ─────────────────────────────────────────────────────────────────
[licenses]
# Confidence threshold for license text matching
confidence-threshold = 0.8
# Explicitly allowed SPDX license identifiers
# Every entry here is matched by at least one crate in the tree. cargo-deny
# reports an unmatched allowance as `license-not-encountered`, and the rule is to
# act on it rather than let the list grow into a set of permissions nobody
# examined — the same reasoning that removed the "OpenSSL" entry (audit F-06),
# where allowing a licence while banning its implementation was a contradiction.
#
# Removing an unused allowance is not a restriction, it is a decision point: if a
# future dependency arrives under one of them, the gate fails, someone looks at
# what pulled it in, and adds it back deliberately. That is the whole value of
# the list.
#
# Removed on 2026-08-09 as unmatched: "BSD-2-Clause", "Unicode-DFS-2016"
# (superseded upstream by Unicode-3.0, which is still here), "CC0-1.0".
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

# ── Bans ─────────────────────────────────────────────────────────────────────
[bans]
# Warn when the same crate is pulled in at multiple versions
multiple-versions = "warn"
# Deny wildcard dependency specifications in Cargo.toml (e.g. dep = "*")
wildcards = "deny"
# Except between huginn's own crates. They are `{ path = ... }` entries with no
# version, which is a wildcard by cargo-deny's reading and a directory on disk by
# cargo's — there is no registry, no resolution and nothing to pin. A version
# there is the crates.io publishing pattern and a second copy of the workspace
# version; carrying one is what made a release bump fail resolution outright.
# Without this the gate fails on the workspace's own structure, which is how a
# required gate stops being run at all.
allow-wildcard-paths = true
# List of crates that must never be used.
#
# "TLS is rustls only, no OpenSSL" is a stated policy (AGENTS.md §9,
# docs/hardening.md) that nothing enforced: the tree is rustls-only today purely
# because every dependency happens to be configured that way. A transitive dep
# flipping a default feature would pull OpenSSL back in — a C TLS stack, a
# system library to keep patched, and a build that breaks the distroless image —
# and CI would stay green. These entries make that a build failure instead.
deny = [
    { name = "openssl", reason = "TLS is rustls only — see docs/hardening.md" },
    { name = "openssl-sys", reason = "pulls in the OpenSSL C library; TLS is rustls only" },
    { name = "native-tls", reason = "delegates to the platform/OpenSSL stack; use rustls" },
    { name = "tokio-native-tls", reason = "native-tls wrapper; use tokio-rustls" },
]
# List of crates that are allowed to appear multiple times
skip = []

# ── Sources ──────────────────────────────────────────────────────────────────
[sources]
# Deny crates from registries other than crates.io
unknown-registry = "deny"
# Deny crates fetched from git: `allow-git` is empty and every dependency comes
# from crates.io, so a git source appearing at all means something pulled in an
# unreviewed, unversioned, force-pushable revision. A warning would scroll past.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
