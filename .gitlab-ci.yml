# .gitlab-ci.yml
#
# Primary CI/CD pipeline for hugin.dev on GitLab.
# Mirror: .github/workflows/ contains equivalent GitHub Actions pipelines.
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   DOCKERHUB_USERNAME  — DockerHub username (masked)
#   DOCKERHUB_TOKEN     — DockerHub access token (masked, protected)
#
# Branch model:
#   feature/* → dev → main
#   push dev  → DockerHub :dev + :x.y.z-dev
#   push main → DockerHub :latest + :x.y.z

# ── Global defaults ──────────────────────────────────────────────────────────
default:
  image: rust:slim
  interruptible: true   # cancel pipeline if a newer push arrives

variables:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Store Cargo cache inside the project dir so GitLab can cache it
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  # Docker-in-Docker TLS
  DOCKER_TLS_CERTDIR: /certs

stages:
  - lint
  - test
  - integration
  - security
  - publish

# ── Shared: Cargo dependency cache ──────────────────────────────────────────
.cargo_cache:
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

# ── Shared: Docker-in-Docker setup ──────────────────────────────────────────
.dind:
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376

# ── Shared: Rule presets ─────────────────────────────────────────────────────
# All branches + all MRs (feature→dev, dev→main)
.rules_all:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# Only: MR targeting main  OR  push to main
.rules_main_gate:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"

# Only pushes to dev (for :dev + :VERSION-dev publish)
.rules_push_dev:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"

# Only pushes to main (for :latest + :VERSION publish)
.rules_push_main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"

# ── STAGE: lint ───────────────────────────────────────────────────────────────

fmt-clippy:
  extends: [.cargo_cache, .rules_all]
  stage: lint
  before_script:
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets --all-features -- -D warnings

# ── STAGE: test ───────────────────────────────────────────────────────────────

test:stable:
  extends: [.cargo_cache, .rules_all]
  stage: test
  needs: [fmt-clippy]
  script:
    - cargo test --all --locked

test:beta:
  extends: [.cargo_cache, .rules_all]
  stage: test
  needs: [fmt-clippy]
  before_script:
    - rustup toolchain install beta
    - rustup default beta
  script:
    - cargo test --all --locked

audit:
  extends: [.cargo_cache, .rules_all]
  stage: test
  needs: [fmt-clippy]
  script:
    - cargo install cargo-audit --locked
    - cargo audit

coverage:
  extends: [.cargo_cache, .rules_all]
  stage: test
  needs: [test:stable]
  before_script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked
  script:
    # LCOV for line-level report + Cobertura for GitLab coverage widget
    - cargo llvm-cov --all --lcov --output-path lcov.info --fail-under-lines 80
    - cargo llvm-cov --all --cobertura --output-path coverage.xml
  # GitLab parses this regex from the job log to display coverage %
  coverage: '/^TOTAL.*?(\d+(?:\.\d+)?)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - lcov.info
    expire_in: 7 days

# ── STAGE: integration ────────────────────────────────────────────────────────

system-integration:
  extends: [.dind, .rules_all]
  stage: integration
  needs: [test:stable]
  before_script:
    - apk add --no-cache python3 curl bash docker-cli-compose
    # Hardcoded test-only token — NOT a production secret
    - echo -n "integration-test-token-hugin-dev-ci" > /tmp/influx_token.txt
  script:
    - docker compose -f docker-compose.integration.yml up -d --build
    - |
      for i in $(seq 1 24); do
        if docker compose -f docker-compose.integration.yml exec -T influxdb influx ping > /dev/null 2>&1; then
          echo "InfluxDB ready"; break
        fi
        [ "$i" -eq 24 ] && echo "InfluxDB did not become healthy" && exit 1
        sleep 5
      done
    - bash scripts/integration-test.sh
  after_script:
    - docker compose -f docker-compose.integration.yml logs || true
    - docker compose -f docker-compose.integration.yml down -v || true

# ── STAGE: security ───────────────────────────────────────────────────────────

trivy:
  extends: [.dind, .rules_main_gate]
  stage: security
  needs: [system-integration]
  before_script:
    - docker build -t hugin-dev:security-scan .
  script:
    # Pass 1: Full scan → GitLab SAST format (visible in MR Security widget)
    # exit-code 0 so the artifact is always uploaded even when findings exist
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$CI_PROJECT_DIR:/workspace" \
        aquasec/trivy:latest image \
          --format gitlab \
          --output /workspace/gl-sast-report.json \
          --severity CRITICAL,HIGH,MEDIUM \
          --exit-code 0 \
          hugin-dev:security-scan
    # Pass 2: Blocking scan — only fixable CRITICAL/HIGH CVEs fail the pipeline
    - |
      docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy:latest image \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          --exit-code 1 \
          hugin-dev:security-scan
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    when: always
    expire_in: 7 days

# ── STAGE: publish ────────────────────────────────────────────────────────────

.publish_base:
  extends: .dind
  stage: publish
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Override this in child jobs"

publish:dev:
  extends: .publish_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"
  needs: [test:stable, test:beta, audit, coverage, system-integration]
  script:
    - VERSION=$(grep -m1 '^## \[[0-9]' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
    - echo "Publishing dev image — version ${VERSION}"
    - |
      docker buildx create --use
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t "$DOCKERHUB_USERNAME/hugin-dev:dev" \
        -t "$DOCKERHUB_USERNAME/hugin-dev:${VERSION}-dev" \
        --push .

publish:release:
  extends: .publish_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  needs: [test:stable, test:beta, audit, coverage, system-integration, trivy]
  script:
    - VERSION=$(grep -m1 '^## \[[0-9]' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
    - echo "Publishing release image — version ${VERSION}"
    - |
      docker buildx create --use
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t "$DOCKERHUB_USERNAME/hugin-dev:latest" \
        -t "$DOCKERHUB_USERNAME/hugin-dev:${VERSION}" \
        --push \
        --label "org.opencontainers.image.version=${VERSION}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        .
    # Create git tag via GitLab API using the job token
    # Requires: Settings → CI/CD → Token Access → Allow job token to push
    - |
      TAG="v${VERSION}"
      EXISTS=$(git ls-remote --tags origin "refs/tags/${TAG}" | wc -l)
      if [ "$EXISTS" -eq 0 ]; then
        git config user.name "GitLab CI"
        git config user.email "ci@gitlab.com"
        git remote set-url origin \
          "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git tag "${TAG}" -m "Release ${TAG}"
        git push origin "${TAG}"
        echo "Created tag ${TAG}"
      else
        echo "Tag ${TAG} already exists — skipping"
      fi
