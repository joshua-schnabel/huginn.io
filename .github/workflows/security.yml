name: Security

# Semgrep SAST (source code) + Trivy CVE scan (Docker image).
# Semgrep: all PRs and branch pushes — early developer feedback.
# Trivy:   only PRs → main and pushes to main — blocks on fixable CRITICAL/HIGH CVEs.

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Security tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Semgrep SAST (source code analysis) ────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Pass 1: Full scan → SARIF (all findings, always uploaded)
      - name: Semgrep – full scan (SARIF)
        run: |
          semgrep scan \
            --config p/rust \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            --exclude target \
            .
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      # Pass 2: Blocking scan — ERROR-severity rules only
      - name: Semgrep – blocking scan (ERROR severity)
        run: |
          semgrep scan \
            --config p/rust \
            --config p/secrets \
            --error \
            --exclude target \
            .

  # ── Trivy CVE scan (Docker image) — only on PRs/pushes to main ─────────────
  trivy:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Reuse Docker layer cache from docker.yml to avoid rebuilding from scratch
      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: huginn:security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pass 1: Full scan → SARIF (all severities, always uploaded)
      - name: Trivy – full scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: huginn:security-scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Pass 2: Blocking scan — fixable CRITICAL/HIGH only
      - name: Trivy – blocking scan (fixable CRITICAL/HIGH only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: huginn:security-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
