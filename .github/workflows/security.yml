name: Security

# Source-code SAST (Semgrep). Runs on every branch push and every PR: it needs
# no build, so security feedback happens everywhere, early. Image CVE scanning
# (Trivy) lives in ci.yml, next to the build that produces the exact image.

on:
  push:          # every branch — SAST feedback before a PR even exists
  pull_request:  # every PR, including the dev → main release PR

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Security tab

jobs:
  # ── Semgrep SAST (source code analysis) ────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5

      # Pass 1: full scan → SARIF, uploaded to the Security tab (never blocks).
      - name: Semgrep – full scan (SARIF)
        run: |
          semgrep scan \
            --config p/rust \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            --exclude target \
            .
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      # Pass 2: blocking scan — ERROR-severity findings fail the run (gate).
      - name: Semgrep – blocking scan (ERROR severity)
        run: |
          semgrep scan \
            --config p/rust \
            --config p/secrets \
            --error \
            --exclude target \
            .
