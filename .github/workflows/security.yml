name: Security

# Semgrep SAST (source code) + Trivy CVE scan (Docker image).
# Semgrep: all pushes and PRs — early developer feedback on every branch.
# Trivy:   every PR and pushes to main — blocks on fixable CRITICAL/HIGH CVEs.

on:
  push:   # all branches
  # Every PR, including dev → main. Previously ["dev"], which meant the release
  # PR — the one that actually ships to users — triggered no security scan at
  # all, and CVEs were only noticed after they had already landed on main.
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Security tab

jobs:
  # ── Semgrep SAST (source code analysis) ────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5

      # Pass 1: Full scan → SARIF (all findings, always uploaded)
      - name: Semgrep – full scan (SARIF)
        run: |
          semgrep scan \
            --config p/rust \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            --exclude target \
            .
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      # Pass 2: Blocking scan — ERROR-severity rules only
      - name: Semgrep – blocking scan (ERROR severity)
        run: |
          semgrep scan \
            --config p/rust \
            --config p/secrets \
            --error \
            --exclude target \
            .
