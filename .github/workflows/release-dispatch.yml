name: Release (dispatch)

# One-click release. Pick patch / minor / major; this computes the next SemVer
# version from the last release, stamps CHANGELOG.md + Cargo.toml, and opens an
# auto-merging PR into main. From there the normal pipeline takes over:
# ci.yml publishes the image (DockerHub + ghcr) and tags vX.Y.Z, then
# release.yml creates the GitHub Release and reopens the changelog on dev.
#
# Only the repository owner may run it (the first step asserts this). RELEASE_PAT
# is needed so the release PR triggers CI and can auto-merge — see release.yml
# and docs/ci-cd.md. Without it the PR is still opened; you'd merge it by hand.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Prepare and merge release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify triggering actor is the repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner ($OWNER) may run this workflow (actor: $ACTOR)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute version, stamp changelog, open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # Base = the higher of the latest v* tag and the top CHANGELOG version,
          # so the very first release still bumps from the changelog's version.
          TAG_V=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          CL_V=$(grep -m1 '^## \[[0-9]' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/' || true)
          BASE=$(printf '%s\n%s\n' "$TAG_V" "$CL_V" | grep -E '^[0-9]' | sort -V | tail -1 || true)
          [ -z "$BASE" ] && BASE=0.0.0

          IFS=. read -r MA MI PA <<< "${BASE%%-*}"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          N="${MA}.${MI}.${PA}"
          echo "Base $BASE + $BUMP -> $N"

          if git ls-remote --tags origin "refs/tags/v${N}" | grep -q .; then
            echo "::error::tag v${N} already exists"; exit 1
          fi

          # Refuse to cut an empty release (nothing under ## [Unreleased]).
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::no ## [Unreleased] section in CHANGELOG.md"; exit 1
          fi
          BODY=$(awk 'BEGIN{f=0}
                      f && substr($0,1,4)=="## [" {exit}
                      $0=="## [Unreleased]" {f=1; next}
                      f && NF>0 {print}' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::error::## [Unreleased] is empty — nothing to release."; exit 1
          fi

          DATE=$(date +%F)
          BR="release/v${N}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BR"

          # Stamp the top ## [Unreleased] as the release heading (entries move
          # under it). Regex-free substring match — a dynamic awk regex with the
          # version's dots would be mis-compiled by gawk.
          awk -v head="## [${N}] - ${DATE}" 'BEGIN{d=0}
               d==0 && $0=="## [Unreleased]" { print head; d=1; next }
               { print }' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          # Compare/tag links + workspace version.
          sed -i "s#^\[Unreleased\]:.*#[Unreleased]: ${REPO_URL}/compare/v${N}...HEAD#" CHANGELOG.md || true
          if ! grep -q "^\[${N}\]:" CHANGELOG.md; then
            if grep -q '^\[Unreleased\]:' CHANGELOG.md; then
              sed -i "/^\[Unreleased\]:/a [${N}]: ${REPO_URL}/releases/tag/v${N}" CHANGELOG.md
            else
              printf '[%s]: %s/releases/tag/v%s\n' "$N" "$REPO_URL" "$N" >> CHANGELOG.md
            fi
          fi
          sed -i "s/^version = \".*\"/version = \"${N}\"/" Cargo.toml

          git add CHANGELOG.md Cargo.toml
          git commit -m "release: v${N}"
          git push -f origin "$BR"

          gh pr create --base main --head "$BR" \
            --title "release: v${N}" \
            --body "Automated **${BUMP}** release. Merges to main once checks pass; the pipeline then publishes the image (DockerHub + ghcr), tags v${N}, and creates the GitHub Release."
          gh pr merge --auto --squash "$BR" || \
            echo "::warning::Could not enable auto-merge (RELEASE_PAT missing?). Merge the PR manually."
