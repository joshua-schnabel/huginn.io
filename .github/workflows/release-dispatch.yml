name: Release (dispatch)

# One-click release. Pick patch / minor / major; this computes the next SemVer
# version from the last release, stamps CHANGELOG.md and the workspace version
# (Cargo.toml *and* Cargo.lock), and opens an auto-merging PR into main. From
# there the normal pipeline takes over:
# ci.yml publishes the image (DockerHub + ghcr) and tags vX.Y.Z, then
# release.yml creates the GitHub Release and reopens the changelog on dev.
#
# Only the repository owner may run it (the first step asserts this). RELEASE_PAT
# is needed so the release PR triggers CI and can auto-merge — see release.yml
# and docs/ci-cd.md. Without it the PR is still opened; you'd merge it by hand.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Release type"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Prepare and merge release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify triggering actor is the repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner ($OWNER) may run this workflow (actor: $ACTOR)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # ── Commit signing ────────────────────────────────────────────────────
      # `dev` and `main` both carry a `required_signatures` rule, so a commit
      # this job creates with the runner's default identity is rejected at merge
      # time — the pull request opens, every check goes green, and the merge
      # button stays blocked with nothing failing. That is what happened after
      # v0.2.1.
      #
      # The identity is read out of the key rather than hard-coded: GitHub marks
      # a signature "Verified" only when the commit's author email matches a UID
      # on the signing key *and* a verified email on the account that owns it.
      # Hard-coding `github-actions[bot]` next to a personal key produces a valid
      # signature that GitHub still shows as unverified.
      - name: Import the commit signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY is not set. The commit would be unsigned and the branch ruleset requires signatures — see docs/ci-cd.md."
            exit 1
          fi
          printenv GPG_PRIVATE_KEY | gpg --batch --quiet --import

          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          UIDSTR="$(gpg --list-secret-keys --with-colons "$KEYID" | awk -F: '/^uid:/ {print $10; exit}')"
          # `Name <email>` is a convention, not a guarantee — a UID may be a
          # bare string. Splitting one of those yields NAME and EMAIL both equal
          # to the whole UID, which is non-empty and therefore passes a naive
          # check, and the commit is then authored by something that is not an
          # address. This keyring holds such a key, so the shape is asserted.
          case "$UIDSTR" in
            *"<"*">"*) ;;
            *) echo "::error::the signing key's first UID is '$UIDSTR' — it must be 'Name <email>'"; exit 1 ;;
          esac
          NAME="${UIDSTR%% <*}"
          EMAIL="${UIDSTR##*<}"; EMAIL="${EMAIL%>}"
          case "$EMAIL" in
            *?@?*) ;;
            *) echo "::error::'$EMAIL' is not an email address"; exit 1 ;;
          esac
          if [ -z "$NAME" ]; then
            echo "::error::could not read a name from the signing key's UID"
            exit 1
          fi
          echo "signing as $NAME <$EMAIL> with $KEYID"

          # A passphrase is optional — a key generated for CI normally has none.
          # When there is one it goes through a 0600 file, never argv:
          # /proc/<pid>/cmdline is readable by every process on the runner, which
          # is the same rule the registry credentials in ci.yml follow.
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            umask 077
            printenv GPG_PASSPHRASE > "$RUNNER_TEMP/gpg-pass"
            {
              echo '#!/usr/bin/env bash'
              echo "exec gpg --batch --pinentry-mode loopback --passphrase-file \"$RUNNER_TEMP/gpg-pass\" \"\$@\""
            } > "$RUNNER_TEMP/gpg-wrap"
            chmod +x "$RUNNER_TEMP/gpg-wrap"
            git config gpg.program "$RUNNER_TEMP/gpg-wrap"
          fi

          git config user.name "$NAME"
          git config user.email "$EMAIL"
          git config user.signingkey "$KEYID"
          git config commit.gpgsign true

      - name: Compute version, stamp changelog, open release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # Base = the higher of the latest v* tag and the top CHANGELOG version,
          # so the very first release still bumps from the changelog's version.
          # The changelog side goes through the shared script rather than a bare
          # grep: it validates SemVer before printing, and this value reaches a
          # shell, a branch name and a git tag.
          TAG_V=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          CL_V=$(bash scripts/changelog-version.sh || true)
          BASE=$(printf '%s\n%s\n' "$TAG_V" "$CL_V" | grep -E '^[0-9]' | sort -V | tail -1 || true)
          [ -z "$BASE" ] && BASE=0.0.0

          IFS=. read -r MA MI PA <<< "${BASE%%-*}"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          N="${MA}.${MI}.${PA}"
          echo "Base $BASE + $BUMP -> $N"

          if git ls-remote --tags origin "refs/tags/v${N}" | grep -q .; then
            echo "::error::tag v${N} already exists"; exit 1
          fi

          # Refuse to cut an empty release (nothing under ## [Unreleased]).
          if ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "::error::no ## [Unreleased] section in CHANGELOG.md"; exit 1
          fi
          BODY=$(awk 'BEGIN{f=0}
                      f && substr($0,1,4)=="## [" {exit}
                      $0=="## [Unreleased]" {f=1; next}
                      f && NF>0 {print}' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::error::## [Unreleased] is empty — nothing to release."; exit 1
          fi

          DATE=$(date +%F)
          BR="release/v${N}"
          git switch -c "$BR"

          # Stamp the top ## [Unreleased] as the release heading (entries move
          # under it). Regex-free substring match — a dynamic awk regex with the
          # version's dots would be mis-compiled by gawk.
          awk -v head="## [${N}] - ${DATE}" 'BEGIN{d=0}
               d==0 && $0=="## [Unreleased]" { print head; d=1; next }
               { print }' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          # Compare/tag links + workspace version.
          sed -i "s#^\[Unreleased\]:.*#[Unreleased]: ${REPO_URL}/compare/v${N}...HEAD#" CHANGELOG.md || true
          if ! grep -q "^\[${N}\]:" CHANGELOG.md; then
            if grep -q '^\[Unreleased\]:' CHANGELOG.md; then
              sed -i "/^\[Unreleased\]:/a [${N}]: ${REPO_URL}/releases/tag/v${N}" CHANGELOG.md
            else
              printf '[%s]: %s/releases/tag/v%s\n' "$N" "$REPO_URL" "$N" >> CHANGELOG.md
            fi
          fi
          # Manifest and lock file together, through the shared helper. Bumping
          # only Cargo.toml leaves every `--locked` job failing with "cannot
          # update the lock file" before a test runs — the release PR would
          # arrive red every time.
          bash scripts/set-workspace-version.sh "$N"

          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "release: v${N}"
          git push -f origin "$BR"

          gh pr create --base main --head "$BR" \
            --title "release: v${N}" \
            --body "Automated **${BUMP}** release. Merges to main once checks pass; the pipeline then publishes the image (DockerHub + ghcr), tags v${N}, and creates the GitHub Release."
          # A merge commit, not a squash: `dev → main` is the one place this
          # repository keeps history (docs/CONTRIBUTING.md). Squashing here would
          # give main a single commit whose parents dev never shares, and the
          # next `main → dev` sync would conflict with itself.
          gh pr merge --auto --merge "$BR" || \
            echo "::warning::Could not enable auto-merge (RELEASE_PAT missing?). Merge the PR manually."
