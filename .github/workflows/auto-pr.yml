name: Branch naming

# Deletes branches that don't follow the naming convention. Nothing else.
#
# It used to open a draft PR into dev as well. That needed "Allow GitHub
# Actions to create and approve pull requests", which is off — a workflow
# able to open PRs is a workflow able to approve them the day a ruleset asks
# for a review — and the PRs it opened carried github-actions as their author,
# so their CI parked on approval instead of running. PRs are opened by whoever
# pushed the branch.
#
# Dependabot manages its own branches and PRs, release.yml manages its own
# release/* housekeeping branch + PR, and lockfile-maintenance.yml manages
# `maintenance/lockfile` — all three are ignored here, otherwise the naming rule
# below would delete them on sight. The last one matters because it is pushed
# with an app token, which (unlike GITHUB_TOKEN) does start this workflow.
on:
  push:
    branches-ignore:
      - "main"
      - "dev"
      - "dependabot/**"
      - "release/**"
      - "maintenance/**"

permissions:
  contents: write   # deleting the ref, and nothing else

jobs:
  enforce:
    name: Enforce branch naming
    runs-on: ubuntu-latest
    steps:
      # No checkout: the only call is `gh api` against an explicit path.
      - name: Delete a branch that does not match the naming convention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -qE '^(feature|fix|chore|docs|test)/.+'; then
            echo "::warning::Branch '$BRANCH' does not match naming convention. Deleting."
            gh api -X DELETE "/repos/${REPO}/git/refs/heads/${BRANCH}"
          fi
