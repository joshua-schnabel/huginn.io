name: CI

on:
  push:
    # Branches only. A `tags: ["v*.*.*"]` trigger used to be here, and it made
    # every release build twice: `publish` pushes the release tag as its last
    # step, that tag push started this whole workflow again, and its `publish`
    # re-created the same user-facing tags from a *second* build. v0.3.0 went out
    # that way — release.yml finished, with its notes and SBOM describing the
    # first build, before the tag run had finished republishing `:0.3.0` over it.
    # The bytes that were scanned and integration-tested are the ones that ship,
    # which only holds if they are built once.
    branches: ["main", "dev"]
  # Every PR, whatever its target branch — so every change is gated before merge.
  pull_request:

# Cancel superseded PR runs. Never cancel a push run — it may be mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal default permissions — no secrets exposed to PR builds
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ── Pipeline shape ─────────────────────────────────────────────────────────
#
#   ── Source ──────────────────────────────────────────────────────────────
#   check ─┬ test (stable + beta·canary) ─┐
#          ├ supply-chain ────────────────┤
#          ├ coverage ────────────────────┤
#          └ version-gate (SemVer + successor, main only) ┤
#                                         ▼
#                                    SOURCE GATE
#   ── Image ─────────────────────────────┼─────────────────────────────────
#                                         ▼
#              build (per arch, native) → image.tar artifact
#                 ├ scan  (Trivy on the artifact)
#                 └ integration (load + compose on the artifact)
#                                         ▼
#                                     IMAGE GATE
#   ── Release (push events only) ────────┼─────────────────────────────────
#                                         ▼
#              push (per arch) → skopeo by digest → digest artifact
#                                         ▼
#              publish → DockerHub manifest, mirror to ghcr, staging cleanup,
#                        then the tag, annotated with the manifest digest
#                                         ▼            (tag push → release.yml:
#                                                       GitHub Release + dev PR)
#
# The two gates are the stage boundaries, not commentary beside them: `build`
# depends on `source-gate` and `push` on `image-gate`, so each stage's membership
# is written down exactly once, in that gate's `needs`. It used to be written
# twice — `build` re-listed the five source jobs — and two copies of a list are
# a list that drifts. See the gate jobs below for the rest of the reasoning.
#
# `coverage` deliberately hangs off `check` rather than `test`: cargo-llvm-cov
# runs the whole suite itself, instrumented, so waiting for `test` bought no
# extra confidence — only a wait on the beta leg, which cannot block anything.
#
# One job, one responsibility. The image is built ONCE per arch into a tarball;
# every later job consumes that same artifact, so the bytes scanned, tested and
# published are identical. push sits behind image-gate, which covers scan AND
# integration, so nothing unscanned can ship.
#
# That chain ends at the tag, and this workflow does not react to tags (see the
# trigger above) — so the release tag is the pipeline's output, never a second
# entry into it. The digest recorded in the tag's message is what lets
# release.yml prove it is describing this build and no other.

jobs:
  # ── Source: Format & Lint ─────────────────────────────────────────────────
  # The `Source ·` / `Image ·` / `Release ·` prefixes exist only to make the run
  # page group by stage — GitHub has no stages of its own, and the run graph is
  # drawn from `needs` alone. The three *gate* names carry no prefix: they are
  # what the branch ruleset requires, and renaming a required check leaves it
  # never reporting, which blocks every pull request. Prefix new jobs; leave the
  # gates alone.
  check:
    name: Source · Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the action's v1 SHA, which makes `toolchain` a required input —
      # the channel itself stays floating, only the action code is frozen.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Source: Tests (stable + beta) ─────────────────────────────────────────
  test:
    name: Source · Tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    strategy:
      fail-fast: false   # report both matrix legs even if one fails
      matrix:
        rust: [stable, beta]
    # beta = next Rust compiler. A canary: non-blocking (continue-on-error) so an
    # upcoming-toolchain break warns without blocking the merge.
    continue-on-error: ${{ matrix.rust == 'beta' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo test
        run: cargo test --all --locked

  # ── Source: Supply-chain security (cargo-deny) ────────────────────────────
  # cargo-deny is a superset of cargo-audit: advisories, licenses, banned
  # crates and registry sources in one pass.
  supply-chain:
    name: Source · Supply-Chain Security
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  # ── Source: Code coverage ≥ 80 % ──────────────────────────────────────────
  # Depends on `check`, not on `test`, so it runs *alongside* the two toolchain
  # legs instead of behind them. `cargo llvm-cov --all` runs the whole suite
  # itself, instrumented — waiting for `test` first never added confidence, it
  # only added the duration of a full suite to the critical path, and part of
  # that wait was the beta leg, which `continue-on-error` forbids from blocking
  # anything. The cost is a coverage run that is also spent on a red push;
  # `source-gate` still lists both jobs, so nothing stops blocking.
  coverage:
    name: Source · Code Coverage (≥ 80%)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Cache the cargo-llvm-cov binary (pinned) so it is compiled from source
      # once, not every run. (cargo-deny is intentionally left uncached/latest —
      # a security tool should keep picking up new advisory classes.)
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-0.8.7
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Run coverage
        run: cargo llvm-cov --all --lcov --output-path lcov.info --fail-under-lines 80
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7
      # The number, where the run that produced it already is. Deliberately not
      # a third-party coverage service: the percentage is something this
      # pipeline computes, and shipping every line of the source tree to an
      # external host to have it computed again buys a badge and costs a
      # dependency with repository access. The README badge reports this job's
      # verdict instead — green means the gate below held.
      #
      # Read from lcov.info rather than parsed out of cargo's output: LF/LH are
      # a stable file format, and a summary table is not.
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -s lcov.info ]; then
            echo "::warning::no lcov.info was produced; the summary is empty"
            exit 0
          fi
          awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit   += $2 }
            END {
              if (found == 0) { print "No coverage data."; exit }
              printf "## Coverage\n\n**%.2f %%** of %d workspace lines (gate: at least 80 %%)\n",
                     hit * 100 / found, found
            }
          ' lcov.info >> "$GITHUB_STEP_SUMMARY"

  # ── Source: release version gate (SemVer + must exceed the last tag) ───────
  # Enforces only for a release context: a PR whose base is main, or a push to
  # main. On every other event it is a deliberate no-op pass rather than a
  # skipped job: `source-gate` treats anything that is not `success` as a
  # failure, so skipping here would fail the gate and take `build` with it. This
  # job must always run and decide internally whether to enforce.
  version-gate:
    name: Source · Version gate
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the tag history to find the last release
          persist-credentials: false
      - name: Validate SemVer and successor
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          REF: ${{ github.ref }}
        run: |
          # Only a release cut is gated: PR into main, or a push to main.
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ]; then :
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then :
          else
            echo "Not a release event (base is not main) — version gate is a no-op."
            exit 0
          fi

          # Extraction *and* SemVer validation live in the shared script, so the
          # gate and the publish job cannot drift apart.
          NEW="$(bash scripts/changelog-version.sh)"
          echo "CHANGELOG version: $NEW"

          # The changelog decides the released version, and the image is tagged
          # from it — but the binary inside that image reports `Cargo.toml`'s
          # version through `--version`. Nothing tied the two together, so a
          # release branch that stamped one and not the other would ship
          # `huginn:0.4.0` announcing itself as 0.3.0, and no gate would notice.
          # Both release paths already write them together via
          # scripts/set-workspace-version.sh; this is what makes that a rule
          # rather than a habit.
          #
          # Scoped to [workspace.package] for the same reason the sed in that
          # script is: an unscoped match would find the first pin in
          # [workspace.dependencies] instead.
          CARGO="$(awk '
            /^\[workspace\.package\]/ { f = 1; next }
            f && /^\[/               { exit }
            f && /^version = /       { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.toml)"
          echo "Cargo.toml workspace version: $CARGO"
          if [ "$NEW" != "$CARGO" ]; then
            echo "::error::CHANGELOG.md says $NEW but Cargo.toml says $CARGO — run scripts/set-workspace-version.sh $NEW"
            exit 1
          fi

          LAST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -z "$LAST" ]; then
            echo "No existing v* tag — treating $NEW as the first release."
            exit 0
          fi
          echo "Last released version: $LAST"

          if [ "$NEW" = "$LAST" ]; then
            echo "::error::Version $NEW equals the last release — bump it before releasing"
            exit 1
          fi
          # sort -V is not full SemVer pre-release precedence, but is correct for
          # x.y.z and adequate for the 0.x / -rc versions used here.
          HIGHEST=$(printf '%s\n%s\n' "$LAST" "$NEW" | sort -V | tail -1)
          if [ "$HIGHEST" != "$NEW" ]; then
            echo "::error::Version $NEW is not greater than the last release $LAST"
            exit 1
          fi
          echo "OK: $NEW is a valid successor to $LAST"

  # ── Build ONCE per arch → image.tar artifact ──────────────────────────────
  # One build per architecture on its own native runner (amd64 on ubuntu-latest,
  # arm64 on ubuntu-24.04-arm — no QEMU). The tarball is uploaded as an artifact
  # and is the single source of truth for scan, integration and publish.
  build:
    name: Image · Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # The whole source stage, named once — see `source-gate` below. This used to
    # re-list its five members, which made `source-gate.needs` a second copy of
    # the same set: a job added to the gate alone would block the merge but not
    # the build, and a job added to `build` alone would gate nothing.
    needs: [source-gate]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker metadata (labels only)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          labels: |
            org.opencontainers.image.title=huginn.io
            org.opencontainers.image.description=Lightweight infrastructure probe monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image to a local tarball
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: huginn:ci
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Upload image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  # ── Scan the built artifact (never rebuilds it) ───────────────────────────
  # Runs on ubuntu-latest for both arches: Trivy reads the tarball's layers, so
  # the host architecture is irrelevant.
  scan:
    name: Image · Trivy scan ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      # The scan itself only needs the tarball, but the blocking pass reads
      # .trivyignore.yaml out of the workspace — without a checkout Trivy exits
      # with "cannot find ignorefile" rather than scanning without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Trivy - full scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        # Fork PRs have a read-only token and can't upload SARIF; the blocking
        # pass still gates them. Per-arch category so the legs don't overwrite.
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ env.PLATFORM_PAIR }}

      # Blocking on FIXABLE CRITICAL/HIGH only. A gate that blocks on findings
      # nobody can act on is a gate that gets switched off.
      #
      # .trivyignore.yaml is read HERE and not by the full scan above, so a
      # suppressed finding still reaches the Security tab. Every entry in it
      # carries an expiry date and a reason the vulnerable code cannot be
      # reached in huginn's deployment — see the file. It is empty today.
      - name: Trivy - blocking scan (fixable CRITICAL/HIGH only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      # ── SBOM, from the same tarball ──────────────────────────────────────
      # Generated from the artefact rather than from a rebuild or a registry
      # pull, for the reason the whole pipeline is shaped this way: an SBOM that
      # describes different bytes than the ones that shipped is worse than none,
      # because it will be believed. Cargo.lock covers the Rust tree; this
      # covers what the image actually carries alongside it.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: cyclonedx
          output: sbom-${{ env.PLATFORM_PAIR }}.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.PLATFORM_PAIR }}
          path: sbom-${{ env.PLATFORM_PAIR }}.cdx.json
          if-no-files-found: error
          retention-days: 90

  # ── Integration-test the built artifact (loaded, never rebuilt) ───────────
  # Native runner per arch: the loaded container must run on matching hardware.
  integration:
    name: Image · Integration test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "${{ runner.temp }}/image.tar"

      # Hardcoded test-only secrets — NOT production values
      - name: Create test secret files
        run: |
          echo -n "integration-test-token-huginn-ci" > /tmp/influx_token.txt
          echo -n "integration-test-metrics-key" > /tmp/metrics_api_key.txt

      - name: Start services
        run: docker compose -f docker-compose.integration.yml up -d --no-build

      - name: Wait for InfluxDB to be healthy
        run: |
          for i in $(seq 1 24); do
            if docker compose -f docker-compose.integration.yml exec -T influxdb influx ping > /dev/null 2>&1; then
              echo "InfluxDB is healthy"; break
            fi
            [ "$i" -eq 24 ] && echo "InfluxDB did not become healthy" && exit 1
            sleep 5
          done

      - name: Run system integration tests
        run: bash scripts/integration-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  # ── The two fan-in gates: stage boundaries, and what the ruleset names ────
  #
  # Everything above reports its own check, and a check that is not in the
  # ruleset's required set is an *indicator*: it goes visibly red and stops
  # nobody. Keeping that set in step with this file by hand is the failure this
  # replaces, and it is not hypothetical here — `ci-cd.md` has been recording
  # for several releases that `ShellCheck` and `Actionlint` "run on every push
  # and PR and go red visibly, but a PR can merge past them", with the fix noted
  # as a one-line ruleset change nobody made. Adding a job is the moment such an
  # omission happens, and it is silent.
  #
  # So the ruleset names these two instead, and they derive the answer from
  # `needs` — the same list the pipeline already has to maintain to order itself
  # correctly. A job added to `needs` is covered by the gate the moment it is
  # added, rather than the moment somebody remembers to edit a repository
  # setting they cannot see from here.
  #
  # They are also where the pipeline *waits*: `build` needs `source-gate` and
  # `push` needs `image-gate`, so each stage's membership is written down once.
  # `build` used to re-list the five source jobs, and two copies of one list is
  # a list that drifts — a job wired only into the gate would have blocked the
  # merge while the build had already started without it.
  #
  # `if: always()` is load-bearing rather than defensive. Without it a gate
  # whose dependency failed does not fail — it is **skipped**, and GitHub counts
  # a skipped required check as satisfied. The gate would be green by absence in
  # exactly the case it exists for. So it always runs, and reads the results
  # itself rather than letting its own scheduling stand in for them. It is also
  # what keeps the chaining honest: a gate that can never be skipped is a
  # dependency that resolves to a real verdict, so `build` and `push` are
  # skipped precisely when their stage did not pass.
  #
  # `push` and `publish` are deliberately in no gate: both are `push`-only, so
  # on a pull request they report `skipped`, and these checks treat anything
  # that is not `success` as a failure.
  #
  # `continue-on-error` on the beta leg keeps its meaning — that leg reports
  # `success` to `needs` even when it fails, which is what makes it a canary
  # rather than a blocker.
  #
  # The two bodies below, and `security-gate` in security.yml, are identical
  # apart from $STAGE. A local composite action would remove the triplication
  # and would cost each gate an `actions/checkout`; these three jobs currently
  # touch no source and hold no credentials, and that is worth more than twelve
  # deduplicated lines of shell.
  #
  # NOTE: `Source gate` and `Image gate` are the names the branch ruleset
  # requires. A renamed required check never reports again, and a check that
  # never reports blocks every pull request. Do not "harmonise" them with the
  # `Source ·` / `Image ·` prefixes on the jobs above.
  source-gate:
    name: Source gate
    runs-on: ubuntu-latest
    needs: [check, test, supply-chain, coverage, version-gate]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every source check succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          STAGE: Source
        run: |
          # The table is written before the verdict, so a failing stage still
          # reports which member failed on the run's summary page — that is the
          # case somebody actually reads it in. `tee -a` puts the same lines in
          # the job log, where the run's own output belongs.
          {
            echo "## $STAGE stage"
            echo
            echo "| job | result |"
            echo "|---|---|"
            printf '%s' "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          bad="$(printf '%s' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::source gate failed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  image-gate:
    name: Image gate
    runs-on: ubuntu-latest
    needs: [build, scan, integration]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every image check succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          STAGE: Image
        run: |
          {
            echo "## $STAGE stage"
            echo
            echo "| job | result |"
            echo "|---|---|"
            printf '%s' "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          bad="$(printf '%s' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then
            echo "::error::image gate failed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  # ── Push the scanned+tested bytes by digest (push events only) ────────────
  # Skopeo copies straight from the artifact tarball — the exact bytes that scan
  # and integration validated. Skipped on pull_request, so DockerHub credentials
  # are never reachable from a PR (fork-safe).
  push:
    name: Release · Push image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # The whole image stage, named once. `if:` narrows this job to push events;
    # it does not loosen the dependency — an `if:` without a status function
    # leaves the implicit `success()` on `needs` in place, so a red `image-gate`
    # still skips this job and, through it, `publish`.
    needs: [image-gate]
    if: github.event_name == 'push'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Push scanned image and record its digest
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          DHUSER: ${{ vars.DOCKERHUB_USERNAME }}
          DHTOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # skopeo writes and reads its credentials here instead of taking them
          # on the command line. `--dest-creds user:token` puts the token in
          # /proc/<pid>/cmdline, readable by every other process on the runner
          # for as long as the copy runs; an auth file is 0600 and confined to
          # this step's temp directory.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          if [ -z "$DHUSER" ] || [ -z "$DHTOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME (repository variable) and DOCKERHUB_TOKEN (repository secret) are not set — see docs/ci-cd.md"
            exit 1
          fi
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printenv DHTOKEN | skopeo login --username "$DHUSER" --password-stdin docker.io

          mkdir -p "${{ runner.temp }}/digests"
          # Staging tag is only a push target; the user-facing multi-arch tag is
          # created by the `publish` job from the digest recorded here, and the
          # staging tags are deleted again once the manifest exists.
          skopeo copy \
            "docker-archive:${{ runner.temp }}/image.tar" \
            "docker://${REPO}:staging-${PLATFORM_PAIR}" \
            --digestfile "${{ runner.temp }}/digest.txt"
          digest="$(cat "${{ runner.temp }}/digest.txt")"
          echo "Pushed ${PLATFORM_PAIR} as ${REPO}@${digest}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the multi-arch manifest, tag it, tag the release ─────────────
  publish:
    name: Release · Publish to DockerHub
    runs-on: ubuntu-latest
    needs: [push]
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      # contents: write — the "Create git tag" step. Inheriting `contents: read`
      #   made `git push origin vX.Y.Z` 403.
      # packages: write — the "Mirror image to ghcr.io" step pushes to GHCR with
      #   the built-in GITHUB_TOKEN.
      contents: write
      packages: write
    steps:
      # The one checkout in this file that keeps its credentials: the last step
      # runs `git push origin "$TAG"`. Nothing between here and there executes
      # third-party code — no cargo, no build — so the token stays inside a job
      # that only runs skopeo, jq and git.
      #
      # RELEASE_PAT rather than the built-in token, because of what has to happen
      # after the push: GitHub does not start a workflow from an event that
      # GITHUB_TOKEN created — the recursion guard — so a tag pushed with it
      # fires nothing and release.yml (`on: push: tags`) never runs. muninn.io
      # shipped with the same wiring and hit it at v0.1.0: the image, the ghcr
      # mirror and the tag all went out, and the GitHub Release, the test report
      # and the housekeeping PR did not. It is the same secret prepare-dev
      # already needs, for the same underlying reason.
      #
      # The fallback keeps the pipeline working without the secret: the tag is
      # still created, and release.yml is then driven by hand through its
      # workflow_dispatch entry point.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # needed to read git history for version tagging
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # A "refuse tags that are not on main" step used to sit here, because this
      # workflow also ran on tag pushes and `refs/tags/v*` is not covered by the
      # branch ruleset. It no longer runs on tags at all (see the trigger), so a
      # hand-pushed tag cannot reach this job to publish anything. release.yml
      # keeps its own copy of that check, which is where it still matters: that
      # workflow does fire on tags.

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # ── Version detection (from CHANGELOG.md) ────────────────────────────
      # The shared script validates SemVer before printing, so `version` can only
      # ever be `x.y.z[-pre][+build]` — it is safe to hand on from here. Every
      # consumer below still takes it through `env:`, never through `${{ }}`
      # inside a shell, so the guarantee does not rest on the script alone.
      - name: Read version from CHANGELOG.md
        id: version
        run: |
          VERSION="$(bash scripts/changelog-version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if git tag already exists
        id: tag_check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} already exists — skipping tag creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Docker metadata (tags + labels) ───────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          tags: |
            # dev branch → :dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # dev branch → :x.y.z-dev  (e.g. 0.1.0-dev)
            type=raw,value=${{ steps.version.outputs.version }}-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # main branch → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # main branch + version from CHANGELOG → :x.y.z
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false' }}
            # Two `type=semver` entries used to follow, deriving :x.y.z and :x.y
            # from a pushed git tag. They were the second half of the double
            # build: the tag this job creates started another run of this
            # workflow, and those entries re-pointed the version tag at its
            # output. The version comes from CHANGELOG.md on main and from
            # nowhere else now, so a version tag is written exactly once.
          labels: |
            org.opencontainers.image.title=huginn.io
            org.opencontainers.image.description=Lightweight infrastructure probe monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/huginn
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: each -t
          # and each digest must become a separate argument.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REPO}@sha256:%s " *)

      # The digest of the manifest list just created — the one immutable name for
      # what this pipeline built, scanned and integration-tested. It is recorded
      # in the git tag below and re-checked by release.yml, so the Release, its
      # notes and its SBOM can prove they describe *this* build. Without it the
      # only shared reference between the two workflows is the mutable
      # `:x.y.z` tag, which is precisely what went wrong at v0.3.0.
      - name: Inspect manifest and record its digest
        id: manifest
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REPO}:${VERSION}"
          DIGEST="$(docker buildx imagetools inspect --format '{{json .Manifest}}' \
            "${REPO}:${VERSION}" | jq -r '.digest // empty')"
          if [ -z "$DIGEST" ]; then
            echo "::error::could not read the manifest digest for ${REPO}:${VERSION}"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: $DIGEST"

      # ── Mirror the finished image to GitHub Container Registry ─────────────
      # `skopeo copy --all` copies the manifest list and every arch blob, so the
      # ghcr image ends up byte-identical (same digests) to the DockerHub image
      # that was scanned and integration-tested — no second build, no ghcr
      # staging tag. Runs for every user-facing tag metadata-action emitted.
      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Mirror image to ghcr.io
        env:
          DH_REPO: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          DHUSER: ${{ vars.DOCKERHUB_USERNAME }}
          DHTOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/huginn
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same reason as the push job: credentials through a 0600 auth file
          # rather than through argv, where every process on the runner can read
          # them out of /proc for the length of the copy.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printenv DHTOKEN    | skopeo login --username "$DHUSER"    --password-stdin docker.io
          printenv GHCR_TOKEN | skopeo login --username "$GHCR_USER" --password-stdin ghcr.io

          echo "$DOCKER_METADATA_OUTPUT_JSON" | jq -r '.tags[]' | while read -r ref; do
            tag="${ref##*:}"
            echo "Mirroring ${DH_REPO}:${tag} -> ${GHCR_REPO}:${tag}"
            skopeo copy --all \
              "docker://${DH_REPO}:${tag}" \
              "docker://${GHCR_REPO}:${tag}"
          done

      # ── Delete the staging tags now the manifest references the digests ───
      # The per-arch manifests survive: the multi-arch manifest list points at
      # them by digest, so removing the tag only drops the pointer. Best-effort;
      # a failure here must not fail a release.
      - name: Remove staging tags
        continue-on-error: true
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          DHUSER: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Body through stdin, built by jq rather than by string interpolation:
          # `-d "{...$TOKEN...}"` would put the token in /proc/<pid>/cmdline, and
          # would also break on any character JSON needs escaped. `--data @-`
          # keeps it in a pipe.
          jwt="$(jq -n --arg u "$DHUSER" --arg p "$TOKEN" '{username:$u, password:$p}' \
            | curl -s -H 'Content-Type: application/json' --data @- \
              https://hub.docker.com/v2/users/login/ | jq -r .token)"
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "Could not obtain a DockerHub token; leaving staging tags in place"
            exit 0
          fi
          # The session token goes through a curl config on stdin for the same
          # reason as the password above — `-H "Authorization: ..."` is argv.
          for tag in staging-linux-amd64 staging-linux-arm64; do
            code="$(printf 'header = "Authorization: JWT %s"\n' "$jwt" \
              | curl -s -K - -o /dev/null -w '%{http_code}' -X DELETE \
                "https://hub.docker.com/v2/repositories/${REPO}/tags/${tag}/")"
            echo "delete ${tag}: HTTP ${code}"
          done

      # ── Create git tag on main (if new version) ───────────────────────────
      # Last, deliberately: everything above has to have succeeded before a tag
      # exists, because the tag is what release.yml reacts to.
      #
      # The message carries the manifest digest. An annotated tag is the right
      # place for it — it is created by the job that knows the digest, it is
      # immutable once pushed, and it travels with the repository rather than
      # with an artifact that expires. release.yml reads it back and refuses to
      # release if the registry's `:x.y.z` no longer resolves to it. The
      # `image-digest:` prefix is the contract between the two files; keep them
      # in step.
      - name: Create git tag
        if: github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" -m "Release $TAG" -m "image-digest: $DIGEST"
          git push origin "$TAG"
