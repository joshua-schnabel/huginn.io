name: CI

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  # Every PR, whatever it targets. Previously limited to main/dev, which left
  # feature branches with no gate at all — that is how feature/refactoring and
  # dev diverged into two different "CI fixes", one of which silently dropped
  # the keep-alive in run().
  pull_request:

# Cancel stale runs for the same ref (e.g. rapid pushes to a feature branch).
# Never cancel a push run: this workflow now publishes to DockerHub, and killing
# that mid-flight is not something to do for a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal default permissions — no secrets exposed to PR builds
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Gate 1: Format & Lint ──────────────────────────────────────────────────
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Gate 2: Tests (stable + beta) ─────────────────────────────────────────
  test:
    name: Tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false   # report both matrix legs even if one fails
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all --locked

  # ── Gate 3: Supply-chain security (cargo-deny) ────────────────────────────
  # cargo-deny is a superset of cargo-audit: checks advisories, licenses,
  # banned crates, and registry sources in one pass.
  supply-chain:
    name: Supply-Chain Security
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  # ── Gate 4a: Code coverage ≥ 80 % ────────────────────────────────────────
  coverage:
    name: Code Coverage (≥ 80%)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Cache the compiled cargo-llvm-cov binary, keyed on a pinned version, so
      # it is built from source once and restored on later runs. This is NOT a
      # prebuilt-binary download — the tool is still compiled with --locked; the
      # cache just skips recompiling it. Pinned so the cache key is stable; bump
      # it when a new cargo-llvm-cov is worth picking up (coverage tooling does
      # not need to be bleeding-edge).
      # Note: cargo-deny is deliberately NOT cached/pinned — it is a security
      # tool and stays on the latest release so it keeps detecting new advisory
      # classes (see the supply-chain job).
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-0.8.7
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Run coverage
        run: cargo llvm-cov --all --lcov --output-path lcov.info --fail-under-lines 80
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── Gate 4b: System Integration Test (Docker Compose) ────────────────────
  system-integration:
    name: System Integration Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Hardcoded test-only token — NOT a production secret
      - name: Create test token file
        run: echo -n "integration-test-token-huginn-ci" > /tmp/influx_token.txt

      # Reuse the Docker layer cache from the publish job below
      - name: Build huginn image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: huginn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and start services
        run: docker compose -f docker-compose.integration.yml up -d --no-build

      - name: Wait for InfluxDB to be healthy
        run: |
          for i in $(seq 1 24); do
            if docker compose -f docker-compose.integration.yml exec -T influxdb influx ping > /dev/null 2>&1; then
              echo "InfluxDB is healthy"; break
            fi
            [ "$i" -eq 24 ] && echo "InfluxDB did not become healthy" && exit 1
            sleep 5
          done

      - name: Run system integration tests
        run: bash scripts/integration-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  # ── Publish to DockerHub ──────────────────────────────────────────────────
  #
  # Lives here, not in its own workflow, and this is the point: as a separate
  # workflow it triggered on `push` in parallel with CI and depended on nothing,
  # so a commit with failing tests, clippy or cargo-deny still shipped :latest.
  # Every gate was bypassable on the one path that reaches users.
  #
  # As a job it simply waits for the same run's gates via `needs`. Folding it in
  # also avoids the `workflow_run` trap, where `github.ref` resolves to the
  # default branch and every `github.ref == 'refs/heads/dev'` check below would
  # silently read false.
  # ── Build & push one image per architecture, by digest ────────────────────
  #
  # Each architecture builds on its OWN native runner — amd64 on ubuntu-latest,
  # arm64 on ubuntu-24.04-arm — instead of emulating arm64 under QEMU on an
  # amd64 runner, which turned a few-minute build into tens of minutes. Neither
  # job applies tags; each pushes a digest-only image, and the `merge` job below
  # assembles the multi-arch manifest and tags it.
  build-image:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [check, test, supply-chain, coverage, system-integration]
    # Push events only — never on pull_request, so DockerHub credentials are
    # never reachable from a PR build.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker metadata (labels only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          labels: |
            org.opencontainers.image.title=huginn.io
            org.opencontainers.image.description=Lightweight infrastructure probe monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-platform cache scope so amd64 and arm64 don't clobber each other.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ vars.DOCKERHUB_USERNAME }}/huginn,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the multi-arch manifest, tag it, tag the release ─────────────
  publish:
    name: Publish to DockerHub
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'push'
    permissions:
      # Needed by the "Create git tag" step. Inheriting `contents: read` made
      # `git push origin vX.Y.Z` 403.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed to read git history for version tagging

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # ── Version detection (from CHANGELOG.md) ────────────────────────────
      - name: Read version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m1 '^## \[[0-9]' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
          if [ -z "$VERSION" ]; then
            echo "ERROR: No versioned entry found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if git tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping tag creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Docker metadata (tags + labels) ───────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          tags: |
            # dev branch → :dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # dev branch → :x.y.z-dev  (e.g. 0.1.0-dev)
            type=raw,value=${{ steps.version.outputs.version }}-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # main branch → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # main branch + version from CHANGELOG → :x.y.z
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false' }}
            # Git tags (v1.2.3) → semver tags (fallback for manual tagging)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=huginn.io
            org.opencontainers.image.description=Lightweight infrastructure probe monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: each -t
          # and each digest must become a separate argument.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ vars.DOCKERHUB_USERNAME }}/huginn@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ vars.DOCKERHUB_USERNAME }}/huginn:${{ steps.meta.outputs.version }}

      # ── Create git tag on main (if new version) ───────────────────────────
      - name: Create git tag
        if: github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

