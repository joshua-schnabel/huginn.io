name: CI

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  # Every PR, whatever it targets. Previously limited to main/dev, which left
  # feature branches with no gate at all — that is how feature/refactoring and
  # dev diverged into two different "CI fixes", one of which silently dropped
  # the keep-alive in run().
  pull_request:

# Cancel stale runs for the same ref (e.g. rapid pushes to a feature branch).
# Never cancel a push run: this workflow now publishes to DockerHub, and killing
# that mid-flight is not something to do for a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal default permissions — no secrets exposed to PR builds
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Gate 1: Format & Lint ──────────────────────────────────────────────────
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Gate 2: Tests (stable + beta) ─────────────────────────────────────────
  test:
    name: Tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false   # report both matrix legs even if one fails
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all --locked

  # ── Gate 3: Supply-chain security (cargo-deny) ────────────────────────────
  # cargo-deny is a superset of cargo-audit: checks advisories, licenses,
  # banned crates, and registry sources in one pass.
  supply-chain:
    name: Supply-Chain Security
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  # ── Gate 4a: Code coverage ≥ 80 % ────────────────────────────────────────
  coverage:
    name: Code Coverage (≥ 80%)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Cache the compiled cargo-llvm-cov binary, keyed on a pinned version, so
      # it is built from source once and restored on later runs. This is NOT a
      # prebuilt-binary download — the tool is still compiled with --locked; the
      # cache just skips recompiling it. Pinned so the cache key is stable; bump
      # it when a new cargo-llvm-cov is worth picking up (coverage tooling does
      # not need to be bleeding-edge).
      # Note: cargo-deny is deliberately NOT cached/pinned — it is a security
      # tool and stays on the latest release so it keeps detecting new advisory
      # classes (see the supply-chain job).
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-0.8.7
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Run coverage
        run: cargo llvm-cov --all --lcov --output-path lcov.info --fail-under-lines 80
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── Build once, scan + integration-test that exact artifact, publish it ────
  #
  # One build per architecture on its own native runner (amd64 on ubuntu-latest,
  # arm64 on ubuntu-24.04-arm — no QEMU). The build writes a local tarball; that
  # SAME file is Trivy-scanned, docker-loaded for the compose integration test,
  # and — only after both pass, and only on push — pushed to the registry with
  # skopeo, straight from the file. So the bytes that are scanned and tested are
  # exactly the bytes that get published, and nothing unscanned ever reaches
  # DockerHub. This one job replaces three separate image builds (integration,
  # Trivy, publish).
  image:
    name: Build, scan & test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [check, test, supply-chain, coverage]
    permissions:
      contents: read
      security-events: write   # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker metadata (labels only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          labels: |
            org.opencontainers.image.title=huginn.io
            org.opencontainers.image.description=Lightweight infrastructure probe monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Build ONCE → local tarball. The single source of truth for the scan,
      #    the test, and (on push) the publish. ──────────────────────────────
      - name: Build image to a local tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: huginn:ci
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # ── Scan that exact tarball ───────────────────────────────────────────
      - name: Trivy - full scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        # Fork PRs get a read-only token and cannot upload SARIF; the blocking
        # pass below still gates them. Per-arch category so the two matrix legs
        # do not overwrite each other in the Security tab.
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ env.PLATFORM_PAIR }}

      - name: Trivy - blocking scan (fixable CRITICAL/HIGH only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # ── Integration-test that exact tarball (loaded, never rebuilt) ───────
      - name: Load image for the integration test
        run: docker load -i "${{ runner.temp }}/image.tar"

      # Hardcoded test-only token — NOT a production secret
      - name: Create test token file
        run: echo -n "integration-test-token-huginn-ci" > /tmp/influx_token.txt

      - name: Build and start services
        run: docker compose -f docker-compose.integration.yml up -d --no-build

      - name: Wait for InfluxDB to be healthy
        run: |
          for i in $(seq 1 24); do
            if docker compose -f docker-compose.integration.yml exec -T influxdb influx ping > /dev/null 2>&1; then
              echo "InfluxDB is healthy"; break
            fi
            [ "$i" -eq 24 ] && echo "InfluxDB did not become healthy" && exit 1
            sleep 5
          done

      - name: Run system integration tests
        run: bash scripts/integration-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

      # ── Publish the scanned+tested bytes (push events only) ───────────────
      #    Skopeo copies straight from the tarball — the bytes never round-trip
      #    through the docker daemon. Skipped on pull_request, so DockerHub
      #    credentials are never reachable from a PR (fork-safe).
      - name: Install skopeo
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Push scanned image and record its digest
        if: github.event_name == 'push'
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          CREDS: ${{ vars.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          # Staging tag is only a push target; the user-facing multi-arch tag is
          # created by the `publish` job from the digest recorded here.
          skopeo copy --dest-creds "$CREDS" \
            "docker-archive:${{ runner.temp }}/image.tar" \
            "docker://${REPO}:staging-${PLATFORM_PAIR}" \
            --digestfile "${{ runner.temp }}/digest.txt"
          digest="$(cat "${{ runner.temp }}/digest.txt")"
          echo "Pushed ${PLATFORM_PAIR} as ${REPO}@${digest}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1


  # ── Assemble the multi-arch manifest, tag it, tag the release ─────────────
  publish:
    name: Publish to DockerHub
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name == 'push'
    permissions:
      # Needed by the "Create git tag" step. Inheriting `contents: read` made
      # `git push origin vX.Y.Z` 403.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed to read git history for version tagging

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # ── Version detection (from CHANGELOG.md) ────────────────────────────
      - name: Read version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m1 '^## \[[0-9]' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
          if [ -z "$VERSION" ]; then
            echo "ERROR: No versioned entry found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if git tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping tag creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Docker metadata (tags + labels) ───────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          tags: |
            # dev branch → :dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # dev branch → :x.y.z-dev  (e.g. 0.1.0-dev)
            type=raw,value=${{ steps.version.outputs.version }}-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # main branch → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # main branch + version from CHANGELOG → :x.y.z
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false' }}
            # Git tags (v1.2.3) → semver tags (fallback for manual tagging)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=huginn.io
            org.opencontainers.image.description=Lightweight infrastructure probe monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: each -t
          # and each digest must become a separate argument.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ vars.DOCKERHUB_USERNAME }}/huginn@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ vars.DOCKERHUB_USERNAME }}/huginn:${{ steps.meta.outputs.version }}

      # ── Create git tag on main (if new version) ───────────────────────────
      - name: Create git tag
        if: github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

