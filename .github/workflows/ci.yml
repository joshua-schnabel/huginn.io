name: CI

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  # Every PR, whatever its target branch — so every change is gated before merge.
  pull_request:

# Cancel superseded PR runs. Never cancel a push run — it may be mid-publish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal default permissions — no secrets exposed to PR builds
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ── Pipeline shape ─────────────────────────────────────────────────────────
#
#   check ─┬ test (stable + beta·canary) ─┐
#          ├ supply-chain ────────────────┤
#          └ coverage (needs test) ───────┤
#                                         ▼
#              build (per arch, native) → image.tar artifact
#                 ├ scan  (Trivy on the artifact)
#                 └ integration (load + compose on the artifact)
#                                         ▼
#              push (per arch, push only) → skopeo by digest → digest artifact
#                                         ▼
#              publish → multi-arch manifest, staging cleanup, release tag
#
# One job, one responsibility. The image is built ONCE per arch into a tarball;
# every later job consumes that same artifact, so the bytes scanned, tested and
# published are identical. publish needs scan AND integration, so nothing
# unscanned can ship.

jobs:
  # ── Gate 1: Format & Lint ──────────────────────────────────────────────────
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Gate 2: Tests (stable + beta) ─────────────────────────────────────────
  test:
    name: Tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    strategy:
      fail-fast: false   # report both matrix legs even if one fails
      matrix:
        rust: [stable, beta]
    # beta = next Rust compiler. A canary: non-blocking (continue-on-error) so an
    # upcoming-toolchain break warns without blocking the merge.
    continue-on-error: ${{ matrix.rust == 'beta' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --all --locked

  # ── Gate 3: Supply-chain security (cargo-deny) ────────────────────────────
  # cargo-deny is a superset of cargo-audit: advisories, licenses, banned
  # crates and registry sources in one pass.
  supply-chain:
    name: Supply-Chain Security
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  # ── Gate 4: Code coverage ≥ 80 % ──────────────────────────────────────────
  coverage:
    name: Code Coverage (≥ 80%)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Cache the cargo-llvm-cov binary (pinned) so it is compiled from source
      # once, not every run. (cargo-deny is intentionally left uncached/latest —
      # a security tool should keep picking up new advisory classes.)
      - name: Cache cargo-llvm-cov
        id: cache-llvm-cov
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-0.8.7
      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Run coverage
        run: cargo llvm-cov --all --lcov --output-path lcov.info --fail-under-lines 80
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── Build ONCE per arch → image.tar artifact ──────────────────────────────
  # One build per architecture on its own native runner (amd64 on ubuntu-latest,
  # arm64 on ubuntu-24.04-arm — no QEMU). The tarball is uploaded as an artifact
  # and is the single source of truth for scan, integration and publish.
  build:
    name: Build image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [check, test, supply-chain, coverage]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker metadata (labels only)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          labels: |
            org.opencontainers.image.title=huginn.io
            org.opencontainers.image.description=Lightweight infrastructure probe monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image to a local tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: huginn:ci
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Upload image tarball
        uses: actions/upload-artifact@v6
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  # ── Scan the built artifact (never rebuilds it) ───────────────────────────
  # Runs on ubuntu-latest for both arches: Trivy reads the tarball's layers, so
  # the host architecture is irrelevant.
  scan:
    name: Trivy scan ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@v7
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Trivy - full scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload SARIF to GitHub Security tab
        # Fork PRs have a read-only token and can't upload SARIF; the blocking
        # pass still gates them. Per-arch category so the legs don't overwrite.
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ env.PLATFORM_PAIR }}

      - name: Trivy - blocking scan (fixable CRITICAL/HIGH only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # ── Integration-test the built artifact (loaded, never rebuilt) ───────────
  # Native runner per arch: the loaded container must run on matching hardware.
  integration:
    name: Integration test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@v7
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load -i "${{ runner.temp }}/image.tar"

      # Hardcoded test-only token — NOT a production secret
      - name: Create test token file
        run: echo -n "integration-test-token-huginn-ci" > /tmp/influx_token.txt

      - name: Start services
        run: docker compose -f docker-compose.integration.yml up -d --no-build

      - name: Wait for InfluxDB to be healthy
        run: |
          for i in $(seq 1 24); do
            if docker compose -f docker-compose.integration.yml exec -T influxdb influx ping > /dev/null 2>&1; then
              echo "InfluxDB is healthy"; break
            fi
            [ "$i" -eq 24 ] && echo "InfluxDB did not become healthy" && exit 1
            sleep 5
          done

      - name: Run system integration tests
        run: bash scripts/integration-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  # ── Push the scanned+tested bytes by digest (push events only) ────────────
  # Skopeo copies straight from the artifact tarball — the exact bytes that scan
  # and integration validated. Skipped on pull_request, so DockerHub credentials
  # are never reachable from a PR (fork-safe).
  push:
    name: Push image ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [scan, integration]
    if: github.event_name == 'push'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Sanitise platform name
        env:
          platform: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Download image tarball
        uses: actions/download-artifact@v7
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Push scanned image and record its digest
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          CREDS: ${{ vars.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          # Staging tag is only a push target; the user-facing multi-arch tag is
          # created by the `publish` job from the digest recorded here, and the
          # staging tags are deleted again once the manifest exists.
          skopeo copy --dest-creds "$CREDS" \
            "docker-archive:${{ runner.temp }}/image.tar" \
            "docker://${REPO}:staging-${PLATFORM_PAIR}" \
            --digestfile "${{ runner.temp }}/digest.txt"
          digest="$(cat "${{ runner.temp }}/digest.txt")"
          echo "Pushed ${PLATFORM_PAIR} as ${REPO}@${digest}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the multi-arch manifest, tag it, tag the release ─────────────
  publish:
    name: Publish to DockerHub
    runs-on: ubuntu-latest
    needs: [push]
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      # Needed by the "Create git tag" step. Inheriting `contents: read` made
      # `git push origin vX.Y.Z` 403.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed to read git history for version tagging

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # ── Version detection (from CHANGELOG.md) ────────────────────────────
      - name: Read version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m1 '^## \[[0-9]' CHANGELOG.md | sed 's/## \[\(.*\)\].*/\1/')
          if [ -z "$VERSION" ]; then
            echo "ERROR: No versioned entry found in CHANGELOG.md"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if git tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping tag creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Docker metadata (tags + labels) ───────────────────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          tags: |
            # dev branch → :dev
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # dev branch → :x.y.z-dev  (e.g. 0.1.0-dev)
            type=raw,value=${{ steps.version.outputs.version }}-dev,enable=${{ github.ref == 'refs/heads/dev' }}
            # main branch → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # main branch + version from CHANGELOG → :x.y.z
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false' }}
            # Git tags (v1.2.3) → semver tags (fallback for manual tagging)
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
          labels: |
            org.opencontainers.image.title=huginn.io
            org.opencontainers.image.description=Lightweight infrastructure probe monitor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # word-splitting is intentional: each -t
          # and each digest must become a separate argument.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ vars.DOCKERHUB_USERNAME }}/huginn@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ vars.DOCKERHUB_USERNAME }}/huginn:${{ steps.meta.outputs.version }}

      # ── Delete the staging tags now the manifest references the digests ───
      # The per-arch manifests survive: the multi-arch manifest list points at
      # them by digest, so removing the tag only drops the pointer. Best-effort;
      # a failure here must not fail a release.
      - name: Remove staging tags
        continue-on-error: true
        env:
          REPO: ${{ vars.DOCKERHUB_USERNAME }}/huginn
          DHUSER: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          jwt="$(curl -s -H 'Content-Type: application/json' \
            -d "{\"username\":\"${DHUSER}\",\"password\":\"${TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)"
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "Could not obtain a DockerHub token; leaving staging tags in place"
            exit 0
          fi
          for tag in staging-linux-amd64 staging-linux-arm64; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT ${jwt}" \
              "https://hub.docker.com/v2/repositories/${REPO}/tags/${tag}/")"
            echo "delete ${tag}: HTTP ${code}"
          done

      # ── Create git tag on main (if new version) ───────────────────────────
      - name: Create git tag
        if: github.ref == 'refs/heads/main' && steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
