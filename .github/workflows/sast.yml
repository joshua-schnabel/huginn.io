name: SAST

# Semgrep source-code analysis — runs on ALL pull requests and branch pushes
# for early developer feedback. Blocks on ERROR-severity findings.
on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Security tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Use the official Semgrep image — fully open-source, no token required
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # ── Pass 1: Full scan → SARIF (all findings, always uploaded) ──────────
      # exit-code 0 ensures the SARIF upload always runs even when findings exist
      - name: Semgrep – full scan (SARIF)
        run: |
          semgrep scan \
            --config p/rust \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            --exclude target \
            .
        continue-on-error: true   # upload SARIF regardless of findings

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

      # ── Pass 2: Blocking scan (ERROR-severity rules only) ──────────────────
      # --error  → exit code 1 if any ERROR-level findings are present
      # This blocks the PR/MR when critical patterns (hardcoded secrets,
      # dangerous unsafe usage, etc.) are detected.
      - name: Semgrep – blocking scan (ERROR severity)
        run: |
          semgrep scan \
            --config p/rust \
            --config p/secrets \
            --error \
            --exclude target \
            .
