version: 2

# Continuous dependency updates, consolidated. Each ecosystem gets ONE grouped
# PR that Dependabot keeps maintained (rebased, deps added/removed as they
# change) instead of a PR per dependency. Dependabot cannot group across
# ecosystems, so this is one PR for Rust crates + one for GitHub Actions.
#
# The group includes major bumps too, so the PR really is "everything in one".
# Interaction with dependabot-auto-merge.yml: that workflow only auto-merges
# patch/minor, so a group PR that happens to include a major waits for manual
# review — you review exactly when a breaking bump is present.
#
# Security updates (advisory-driven) are intentionally NOT grouped — Dependabot
# still opens those as their own PRs so an urgent CVE fix isn't held back.
#
# Note: Dependabot uses `dependabot/*` branch names, which auto-pr.yml leaves
# alone (see its branches-ignore).
updates:
  # ── Rust crates (workspace root Cargo.toml / Cargo.lock) ──────────────────
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      cargo:
        patterns: ["*"]

  # ── GitHub Actions pinned in .github/workflows ────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
