[workspace]
members = [
    "huginn",
    "crates/huginn-core",
    "crates/huginn-probes",
    "crates/huginn-influx",
    "crates/huginn-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["huginn.io contributors"]
license = "MIT"
repository = "https://github.com/placeholder/huginn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Web framework (debug UI)
axum = "0.7"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Colored output
colored = "2"

# InfluxDB client — unused workspace dep removed; writer uses raw reqwest line protocol
# influxdb2 = "0.5"          # removed: not used
# influxdb2-structmap = "0.2" # removed: not used

# Async IMAP — removed: IMAP probe uses raw tokio TcpStream, no imap crate needed
# async-imap = "0.10"        # removed: not used
# async-native-tls = "0.5"   # removed: not used

# Time
chrono = { version = "0.4", features = ["serde"] }
# tokio-cron-scheduler removed: scheduler uses simple tokio::time::interval()
# tokio-cron-scheduler = "0.11"

# DNS resolver
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }

# Test helpers (available workspace-wide)
tempfile = "3"
wiremock = "0.6"
tokio-stream = { version = "0.1", features = ["sync"] }
