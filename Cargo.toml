[workspace]
members = [
    "huginn",
    "crates/huginn-core",
    "crates/huginn-probes",
    "crates/huginn-influx",
    "crates/huginn-web",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
# The floor. The Dockerfile's builder must be at or above it — Dependabot moves
# that tag forward on its own, so "at least" is the invariant that survives an
# update; "equal to" would be false the morning after every bump.
#
# CI tests on floating stable, so a dependency raising the MSRV leaves CI green
# while the Docker build — the actual artefact — fails. That is not
# hypothetical: hickory-resolver 0.26, required for RUSTSEC-2026-0119, needs
# 1.88 and broke the image build against the then-current 1.85 builder while
# every local check stayed green.
#
# Note this field documents our floor; with edition 2021 the resolver does not
# refuse dependencies that exceed it (that needs
# `resolver.incompatible-rust-versions = "fallback"`, which here would silently
# pick a hickory without the CVE fix). The Docker build is the real gate.
rust-version = "1.88"
authors = ["huginn.io contributors"]
license = "MIT"
repository = "https://github.com/joshua-schnabel/huginn.io"
# huginn ships as a container image, not as crates. The crate APIs are internal
# structure and `docs/versioning.md` says so explicitly — this makes that a
# property of the manifest rather than a promise in a document, and stops an
# accidental `cargo publish` from turning them into someone's dependency.
publish = false

[workspace.dependencies]
# Async runtime. Explicit feature set rather than "full": only these subsystems
# are used (net, timers, broadcast/RwLock, OS signals, AsyncRead for the
# SMTP/IMAP banners). "process" is test-only (binary_lifecycle_test) and lives in
# huginn's dev-dependencies, so it isn't compiled into the release binary.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "signal",
    "io-util",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Web framework (debug UI)
axum = "0.8"
# The connection cap and header-read timeout in huginn-web/src/serve.rs. Both
# already sit in the tree under axum, so declaring them adds no crate to the
# supply chain — it only names what is already there. A tower layer could not
# do the job: it wraps the service, and a request head that never completes
# never reaches one (F-03).
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Object-safe async traits.
# Native `async fn` in traits is stable since 1.75, but AFIT traits are not
# dyn-compatible, and `&dyn Probe` is the whole point. Proc-macro only, and
# already in the tree via axum — zero new runtime dependencies.
async-trait = "0.1"

# Colored output
colored = "3"

# InfluxDB client — unused workspace dep removed; writer uses raw reqwest line protocol
# influxdb2 = "0.5"          # removed: not used
# influxdb2-structmap = "0.2" # removed: not used

# Async IMAP — removed: IMAP probe uses raw tokio TcpStream, no imap crate needed
# async-imap = "0.10"        # removed: not used
# async-native-tls = "0.5"   # removed: not used

# Time
chrono = { version = "0.4", features = ["serde"] }
# tokio-cron-scheduler removed: scheduler uses simple tokio::time::interval()
# tokio-cron-scheduler = "0.11"

# DNS resolver
# 0.26 required: 0.24 pulls hickory-proto <0.26.1 (RUSTSEC-2026-0119, O(n²) name compression)
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }

# X.509 parsing — reads a certificate's notAfter for the TLS-expiry probe.
x509-parser = "0.18"

# The TLS-expiry probe's handshake. Both were already in the tree under reqwest,
# so declaring them adds nothing to the supply chain — it only names what is
# there (the same situation as hyper-util in huginn-web). `ring` rather than
# aws-lc-rs because that is the provider reqwest already pulls in; two crypto
# backends in one binary would be a real addition.
#
# Needed because the probe cannot go through reqwest: an HTTP client only
# reaches the certificate by making an HTTP request, which restricts the probe
# to endpoints that speak HTTP over TLS. IMAPS, SMTPS and LDAPS present
# certificates that expire exactly like any other — see ADR-0006.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

# Test helpers (available workspace-wide)
tempfile = "3"
wiremock = "0.6"
tokio-stream = { version = "0.1", features = ["sync"] }

# Release profile — the binary that ships in the distroless image.
# strip: drop symbols (a large fraction of an unstripped Rust binary's size).
# lto=thin + codegen-units=1: cross-crate inlining and a single codegen unit for
# a smaller, faster artefact. `panic` is left at "unwind" (abort is a behaviour
# change, deliberately out of scope).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
