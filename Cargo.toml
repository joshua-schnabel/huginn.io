[workspace]
members = [
    "huginn",
    "crates/huginn-core",
    "crates/huginn-probes",
    "crates/huginn-influx",
    "crates/huginn-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Must match the builder image in the Dockerfile. CI tests on floating stable, so
# a dependency raising the MSRV leaves CI green while the Docker build — the
# actual artefact — fails. That is not hypothetical: hickory-resolver 0.26,
# required for RUSTSEC-2026-0119, needs 1.88 and broke the image build against
# the previous 1.85 pin while every local check stayed green.
#
# Note this field documents our floor; with edition 2021 the resolver does not
# refuse dependencies that exceed it (that needs
# `resolver.incompatible-rust-versions = "fallback"`, which here would silently
# pick a hickory without the CVE fix). The Docker build is the real gate.
rust-version = "1.88"
authors = ["huginn.io contributors"]
license = "MIT"
repository = "https://github.com/joshua-schnabel/huginn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Web framework (debug UI)
axum = "0.7"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Colored output
colored = "2"

# InfluxDB client — unused workspace dep removed; writer uses raw reqwest line protocol
# influxdb2 = "0.5"          # removed: not used
# influxdb2-structmap = "0.2" # removed: not used

# Async IMAP — removed: IMAP probe uses raw tokio TcpStream, no imap crate needed
# async-imap = "0.10"        # removed: not used
# async-native-tls = "0.5"   # removed: not used

# Time
chrono = { version = "0.4", features = ["serde"] }
# tokio-cron-scheduler removed: scheduler uses simple tokio::time::interval()
# tokio-cron-scheduler = "0.11"

# DNS resolver
# 0.26 required: 0.24 pulls hickory-proto <0.26.1 (RUSTSEC-2026-0119, O(n²) name compression)
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }

# Test helpers (available workspace-wide)
tempfile = "3"
wiremock = "0.6"
tokio-stream = { version = "0.1", features = ["sync"] }
